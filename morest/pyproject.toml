[project]
name = "morest"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "~=3.11.0"
dependencies = [
    "flex~=6.14.1",
    "graphviz~=0.20.1",
    "loguru~=0.6.0",
    "numpy~=1.26.4",
    "prance~=0.22.11.4.0",
    "pyyaml~=6.0",
    "requests~=2.28.2",
    "rstr~=3.2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
    "ty>=0.0.35",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.format]
quote-style = "double"

[tool.uv]
package = false
